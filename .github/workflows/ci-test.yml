name: ci-test
run-name: Testing New Builds
on:
    workflow_dispatch:
    issue_comment:
        types: [created]
jobs:
    unit-testing:
        runs-on: ubuntu-latest
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event.issue.pull_request && contains(github.event.comment.body, 'Build'))
        steps:
            - name: SCM Checkout
              id: checkout
              uses: actions/checkout@v7
            - name: Install GO
              uses: actions/setup-go@v7
              with:
                go-version: '1.22'
                token: ${{ github.token }}
                cache: true
            - name: Run tests
              run: go test -v -race
    build:
        runs-on: ubuntu-latest
        needs: unit-testing
        permissions:
            id-token: write # required for OIDC
            contents: read  # required for checkout
        steps:
            - name: SCM Checkout
              id: checkout
              uses: actions/checkout@v7
            - name: Setup Credentials AWS
              id: aws-auth-setup
              uses: aws-actions/configure-aws-credentials@v6
              with:
                audience: sts.amazonaws.com
                role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
                aws-region: ${{ vars.AWS_REGION }}
            - name: Amazon ECR Login
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
              with:
                registry-type: public
            - name: Build and push image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }} # = public.ecr.aws
                REGISTRY_ALIAS: s6y9v0i2
                ECR_REPOSITORY: gh-actions-cicd
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker build -t ${{ env.ECR_REGISTRY}}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
                docker push ${{ env.ECR_REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
