name: ci-test
run-name: Testing New Builds
on:
    workflow_dispatch:
    issue_comment:
        types: [created]
jobs:
    unit-testing:
        runs-on: ubuntu-latest
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event.issue.pull_request && contains(github.event.comment.body, 'Build'))
        steps:
            - name: SCM Checkout
              id: checkout
              uses: actions/checkout@v7
            - name: Install GO
              uses: actions/setup-go@v7
              with:
                go-version: '1.22'
                token: ${{ github.token }}
                cache: true
            - name: Run tests
              run: go test -v -race
    build:
        runs-on: ubuntu-latest
        needs: unit-testing
        permissions:
            id-token: write # required for OIDC
            contents: read  # required for checkout
        steps:
            - name: SCM Checkout
              id: checkout
              uses: actions/checkout@v7
            # - name: "Setup tags for ${{ github.ref }}"
            #   run: |
            #     if [ "$GITHUB_REF" == "refs/heads/master" ]; then
            #     echo "DOCKER_TAG=latest" >> $GITHUB_ENV
            #     else
            #     echo "DOCKER_TAG=snapshot" >> $GITHUB_ENV
            #     fi
            #     echo "VCS_REF=`git rev-parse --short HEAD`" >> $GITHUB_ENV
            #     echo "BUILD_DATE=`date -u +”%Y-%m-%dT%H:%M:%SZ”`" >> $GITHUB_ENV
            - name: Debug OIDC + role
              env:
                ROLE: ${{ secrets.AWS_IAM_ROLE }}
              run: |
                # 1. Does the secret exactly match the role ARN?
                if [ "$ROLE" = "arn:aws:iam::660383922069:role/github-actions-role" ]; then
                  echo "Secret: MATCH"
                else
                  echo "Secret: MISMATCH (length ${#ROLE}, expected 51)"
                fi
                # 2. What sub/aud is GitHub sending?
                TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
                echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:d.get(k) for k in ('sub','aud','iss')}, indent=2))"
            - name: Setup Credentials AWS
              id: aws-auth-setup
              uses: aws-actions/configure-aws-credentials@v6
              with:
                audience: sts.amazonaws.com
                role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
                aws-region: ${{ vars.AWS_REGION }}
            - name: Amazon ECR Login
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
            - name: Build and push image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                REGISTRY_ALIAS: s6y9v0i2
                ECR_REPOSITORY: gh-actions-cicd
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker build -t ${{ env.ECR_REGISTRY}}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
                docker push ${{ env.ECR_REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
