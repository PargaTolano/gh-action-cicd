name: ci-test
run-name: Testing New Builds
on:
    workflow_dispatch:
      inputs:
        cloud-service:
            description: "Which cloud service will the image push to"
            required: true
            type: choice
            options: [aws, gcp]
    issue_comment:
        types: [created]
jobs:
    unit-testing:
        runs-on: ubuntu-latest
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event.issue.pull_request && contains(github.event.comment.body, 'Build'))
        steps:
            - name: SCM Checkout
              id: checkout
              uses: actions/checkout@v7
            - name: Install GO
              uses: actions/setup-go@v7
              with:
                go-version: '1.22'
                token: ${{ github.token }}
                cache: true
            - name: Run tests
              run: go test -v -race
    build-aws:
        runs-on: ubuntu-latest
        if: |
          github.event_name == 'workflow_dispatch' && inputs.cloud-service == 'aws'|| 
          github.event.issue.pull_request && contains(github.event.comment.body, 'Build AWS')
        needs: unit-testing
        permissions:
            id-token: write # required for OIDC
            contents: read  # required for checkout
        steps:
            - name: SCM Checkout
              id: checkout
              uses: actions/checkout@v7
            - name: Setup Credentials AWS
              id: aws-auth-setup
              uses: aws-actions/configure-aws-credentials@v6
              with:
                audience: sts.amazonaws.com
                role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
                aws-region: ${{ vars.AWS_REGION }}
            - name: Amazon ECR Login
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
              with:
                registry-type: public
            - name: Build and push image
              id: push-image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }} # = public.ecr.aws
                REGISTRY_ALIAS: ${{ vars.AWS_REGISTRY_ALIAS }}
                ECR_REPOSITORY: ${{ vars.AWS_REPOSITORY }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker build -t ${{ env.ECR_REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
                docker push ${{ env.ECR_REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            - name: Save image tag
              run: echo "${{ github.sha }}" > image-tag.txt
            - name: Upload image tag
              uses: actions/upload-artifact@v4
              with:
                name: image-tag
                path: image-tag.txt
                retention-days: 1
    build-gcp:
      runs-on: ubuntu-latest
      if: |
        github.event_name == 'workflow_dispatch' && inputs.cloud-service == 'gcp' ||
        github.event.issue.pull_request && contains(github.event.comment.body, 'Build GCP')
      needs: unit-testing
      permissions:
        id-token: write # OIDC required
        contents: read  # checkout
      steps:
        - name: SCM Checkout
          id: checkout
          uses: actions/checkout@v7
        - name: Setup Google Auth
          id: auth
          uses: google-github-actions/auth@12060449e87204eca501a11f2f7f1483024afff0
          with:
            workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
            service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
        - name: Setup gcloud
          uses: google-github-actions/setup-gcloud@01af06c41d9aa0790d6fdc8f0b982b768ca4d102
        - name: Configure docker for push
          run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev
        - name: Build and push
          env:
            IMAGE_TAG: ${{ github.sha }}
          run: |
            docker build -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{  vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE_NAME }}:${{ env.IMAGE_TAG }} .
            docker push ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{  vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE_NAME }}:${{ env.IMAGE_TAG }}
        - name: Save image tag
          run: echo "${{ github.sha }}" > image-tag.txt
        - name: Upload image tag
          uses: actions/upload-artifact@v4
          with:
            name: image-tag
            path: image-tag.txt
            retention-days: 1
