name: SonarCloud
run-name: SonarCloud
on:
    push:
        branches: [master]
    pull_request:
        types: [opened, synchronize, reopened]
jobs:
    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest
        steps:
            - name: SCM Checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: SonarCloud Scan
              uses: SonarSource/sonarqube-scan-action@708c7c7110995f73a80a7a0c5cfee4e9961949a0
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
