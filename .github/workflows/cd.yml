name: cd-test
run-name: Deploying New Builds
on:
    workflow_dispatch:
    issue_comment:
        types: [created]
jobs:
    deploy-ecs-express:
        runs-on: ubuntu-latest
        permissions:
            id-token: write # required for OIDC
            contents: read  # required for checkout
        steps:
            - name: Setup Credentials AWS
              id: aws-auth-setup
              uses: aws-actions/configure-aws-credentials@v6
              with:
                audience: sts.amazonaws.com
                role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
                aws-region: ${{ vars.AWS_REGION }}
            - name: Amazon ECR Login
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
              with:
                registry-type: public
            - name: Deploy to ECS Express Mode
              uses: aws-actions/amazon-ecs-deploy-express-service@v1
              with:
                  service-name: go-app
                  image: ${{ env.ECR_REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
                  execution-role-arn: ${{ secrets.IAM_ECS_EXECUTION_ROLE }}
                  infrastructure-role-arn: ${{ secrets.IAM_ECS_INFRASTRUCTURE_ROLE }}
