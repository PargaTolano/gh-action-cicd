name: cd-test
run-name: Deploying New Builds
on:
    workflow_dispatch:
      inputs:
          cloud-service:
              description: "Which cloud service will the image deploy to"
              required: true
              type: choice
              options: [aws, gcp]
          image-tag:
              description: "Image tag to deploy (defaults to the current commit SHA)"
              required: true
permissions:
    id-token: write # required for OIDC
    contents: read  # required for checkout
    actions: read   # required to download artifacts from another run
concurrency:
  group: cd-production
  cancel-in-progress: false   # never kill a deployment halfway
jobs:
    deploy-ecs-express:
        runs-on: ubuntu-latest
        if: inputs.cloud-service == 'aws'
        env:
            ECR_REGISTRY: ${{ vars.AWS_REGISTRY }} # = public.ecr.aws
            REGISTRY_ALIAS: ${{ vars.AWS_REGISTRY_ALIAS }}
            ECR_REPOSITORY: ${{ vars.AWS_REPOSITORY }}
            SERVICE_NAME: go-app
            CLUSTER: default
        steps:
            - name: Download image tag from CI run
              if: github.event_name != 'workflow_run'
              uses: actions/download-artifact@v4
              with:
                name: image-tag
                run-id: ${{ github.event.workflow_run.id }}
                github-token: ${{ github.token }}
            - name: Read image tag
              id: tag
              run: echo "image-tag=$(cat image-tag.txt)" >> "$GITHUB_OUTPUT"
            - name: Setup Credentials AWS
              id: aws-auth-setup
              uses: aws-actions/configure-aws-credentials@v6
              with:
                audience: sts.amazonaws.com
                role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
                aws-region: ${{ vars.AWS_REGION }}
            # - name: Verify image exists in ECR
            #   run: |
            #     aws ecr describe-images \
            #     --repository-name "$ECR_REPOSITORY" \
            #     --image-ids imageTag="${{ steps.tag.outputs.tag }}" > /dev/null
            - name: Deploy to ECS Express Mode       
              id: deploy                                                              
              uses: aws-actions/amazon-ecs-deploy-express-service@v1
              with:
                  service-name: ${{ env.SERVICE_NAME }}
                  cluster: ${{ env.CLUSTER }}
                  image: ${{ env.ECR_REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image-tag }}
                  execution-role-arn: ${{ secrets.IAM_ECS_EXECUTION_ROLE }}
                  infrastructure-role-arn: ${{ secrets.IAM_ECS_INFRASTRUCTURE_ROLE }}
            - name: Summary
              run: |
                echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
                echo "- Image tag: \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
                echo "- Service: ${{ steps.deploy.outputs.service-arn }}" >> "$GITHUB_STEP_SUMMARY"
                echo "- Endpoint: ${{ steps.deploy.outputs.endpoint }}" >> "$GITHUB_STEP_SUMMARY"
    deploy-gcp:
      runs-on: ubuntu-latest
      if: inputs.cloud-service == 'gcp'
      steps:
        - name: Setup Google Auth
          id: auth
          uses: google-github-actions/auth@12060449e87204eca501a11f2f7f1483024afff0
          with:
            workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
            service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
        - name: Deploy to CloudRun
          id: deploy
          uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d
          with:
            service: ${{ vars.GCP_SERVICE_NAME }}
            image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE_NAME }}:${{ inputs.image-tag }}
        - name: 'Accepting test'
          run: 'curl "${{ steps.deploy.outputs.url }}"'
